name: Build Windows - v20.27 RZD ASLS AUTOFILL DEBUG FIX

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.10,<7"
          pip install -r requirements.txt

      - name: Check source
        shell: pwsh
        run: |
          python -m py_compile LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX.py

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX" `
            --icon "app.ico" `
            --collect-all tkinterdnd2 `
            --collect-all fitz `
            --collect-all PIL `
            "LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX.py"

      - name: Restore and verify Tcl/Tk runtime
        shell: pwsh
        run: |
          $tcl = python -c "import tkinter, pathlib; print(pathlib.Path(tkinter.Tcl().eval('info library')).parent)"
          $tk = python -c "import tkinter, pathlib; t=tkinter.Tk(); print(pathlib.Path(t.tk.eval('set tk_library'))); t.destroy()"
          $internal = "dist\LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX\_internal"

          New-Item -ItemType Directory -Force "$internal\_tcl_data" | Out-Null
          New-Item -ItemType Directory -Force "$internal\_tk_data" | Out-Null
          Copy-Item "$tcl\*" "$internal\_tcl_data" -Recurse -Force
          Copy-Item "$tk\*" "$internal\_tk_data" -Recurse -Force

          if (!(Test-Path "$internal\_tcl_data\init.tcl")) { throw "Tcl runtime missing: init.tcl" }
          if (!(Test-Path "$internal\_tk_data\tk.tcl")) { throw "Tk runtime missing: tk.tcl" }

      - name: Pack Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX\*" `
            -DestinationPath "LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX_Windows.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX_Windows
          path: LED_Screen_Designer_v20_27_RZD_ASLS_AUTOFILL_DEBUG_FIX_Windows.zip
          if-no-files-found: error
